name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: mvn verify (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [expense-service, auth-service, api-gateway]
    defaults:
      run:
        working-directory: expense-tracker-quarkus/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: expense-tracker-quarkus/${{ matrix.service }}/pom.xml

      # Tests use Quarkus Dev Services, which start PostgreSQL in Docker (available on ubuntu-latest).
      - name: mvn verify
        run: ./mvnw -B verify

      - name: Upload generated Kubernetes manifests
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-${{ matrix.service }}
          path: expense-tracker-quarkus/${{ matrix.service }}/target/kubernetes/

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: expense-tracker-quarkus/${{ matrix.service }}/target/surefire-reports/

  docker:
    name: docker compose build
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        working-directory: expense-tracker-quarkus
        env:
          POSTGRES_PASSWORD: ci
          AUTH_DB_PASSWORD: ci
          EXPENSE_DB_PASSWORD: ci
        run: |
          mkdir -p keys && touch keys/privateKey.pem
          docker compose build
