# ---------------------------------------------------------------------------
# API Gateway - single entry point for the frontend
# ---------------------------------------------------------------------------
quarkus.application.name=api-gateway
quarkus.http.port=${HTTP_PORT:8080}
quarkus.http.test-port=0

# ---------------------------------------------------------------------------
# Service discovery: SmallRye Stork with a static service list.
# REST clients call stork://<service-name>; Stork picks an instance from the list
# (round-robin when several addresses are given, e.g. "host1:8080,host2:8080").
# ---------------------------------------------------------------------------
quarkus.rest-client.auth-service.url=stork://auth-service
quarkus.rest-client.expense-service.url=stork://expense-service

quarkus.stork.auth-service.service-discovery.type=static
quarkus.stork.auth-service.service-discovery.address-list=${AUTH_SERVICE_ADDRESSES:localhost:8081}
quarkus.stork.expense-service.service-discovery.type=static
quarkus.stork.expense-service.service-discovery.address-list=${EXPENSE_SERVICE_ADDRESSES:localhost:8082}

# Return downstream 4xx/5xx as Responses (relayed to the caller) instead of throwing,
# so HTTP errors are never mistaken for transport failures and retried.
quarkus.rest-client.auth-service.disable-default-mapper=true
quarkus.rest-client.expense-service.disable-default-mapper=true

# Fail fast when an instance is unreachable (e.g. stopped container: TCP SYNs are silently dropped)
# so the gateway answers 503 within ~1s per attempt instead of waiting for the full @Timeout.
quarkus.rest-client.auth-service.connect-timeout=${DOWNSTREAM_CONNECT_TIMEOUT_MS:1000}
quarkus.rest-client.expense-service.connect-timeout=${DOWNSTREAM_CONNECT_TIMEOUT_MS:1000}

# ---------------------------------------------------------------------------
# JWT validation at the edge (RS256, public key from auth-service's JWKS).
# ---------------------------------------------------------------------------
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:http://localhost:8081/api/auth/jwks}
mp.jwt.verify.issuer=${JWT_ISSUER:https://expense-tracker.local/auth}
mp.jwt.verify.publickey.algorithm=RS256
smallrye.jwt.jwks.refresh-interval=10
# Authenticate lazily so public routes never touch JWT parsing and auth failures
# reach the JSON exception mappers.
quarkus.http.auth.proactive=false

# ---------------------------------------------------------------------------
# CORS for the Angular dev server (comma-separated list via CORS_ORIGINS)
# ---------------------------------------------------------------------------
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:4200}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,Accept
quarkus.http.cors.exposed-headers=Location
quarkus.http.cors.access-control-max-age=1H

# ---------------------------------------------------------------------------
# Test profile: shorter fault-tolerance timings (MicroProfile FT global overrides)
# ---------------------------------------------------------------------------
%test.Timeout/value=500
%test.Retry/delay=50
%test.Retry/jitter=0

quarkus.smallrye-openapi.info-title=Expense Tracker API Gateway
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.swagger-ui.always-include=true

# ---------------------------------------------------------------------------
# Metrics (Micrometer + Prometheus) at /q/metrics
# ---------------------------------------------------------------------------
quarkus.micrometer.export.prometheus.enabled=true

# ---------------------------------------------------------------------------
# Kubernetes manifests, generated at build time into target/kubernetes/kubernetes.yml
# (health probes added automatically). Service names match the other services' generated Services.
# ---------------------------------------------------------------------------
quarkus.kubernetes.part-of=expense-tracker
quarkus.kubernetes.env.vars.auth-service-addresses=auth-service:80
quarkus.kubernetes.env.vars.expense-service-addresses=expense-service:80
quarkus.kubernetes.env.vars.jwt-public-key-location=http://auth-service/api/auth/jwks
quarkus.kubernetes.resources.requests.memory=256Mi
quarkus.kubernetes.resources.limits.memory=512Mi
quarkus.container-image.group=expense-tracker
quarkus.kubernetes.image-pull-policy=if-not-present
