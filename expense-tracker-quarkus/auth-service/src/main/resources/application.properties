# ---------------------------------------------------------------------------
# Auth Service
# ---------------------------------------------------------------------------
quarkus.application.name=auth-service
quarkus.http.port=${HTTP_PORT:8081}
quarkus.http.test-port=0

# ---------------------------------------------------------------------------
# Database (PostgreSQL). Credentials always come from the environment.
# ---------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql

%dev.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
%dev.quarkus.datasource.username=${DB_USERNAME:auth_user}
%dev.quarkus.datasource.password=${DB_PASSWORD}
%dev.quarkus.hibernate-orm.schema-management.strategy=update

%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.hibernate-orm.schema-management.strategy=update

# ---------------------------------------------------------------------------
# JWT issuing. The private key is NEVER in the repository:
#  - dev: generated by ../scripts/generate-keys.sh into ../keys (git-ignored)
#  - prod: path of a mounted secret, supplied via JWT_PRIVATE_KEY_LOCATION
#  - test: a throwaway key generated by the test suite
# ---------------------------------------------------------------------------
%dev.auth.jwt.private-key-location=${JWT_PRIVATE_KEY_LOCATION:../keys/privateKey.pem}
%prod.auth.jwt.private-key-location=${JWT_PRIVATE_KEY_LOCATION}
auth.jwt.issuer=${JWT_ISSUER:https://expense-tracker.local/auth}
auth.jwt.lifespan-seconds=${JWT_LIFESPAN_SECONDS:3600}

# ---------------------------------------------------------------------------
# OpenAPI / Swagger UI
# ---------------------------------------------------------------------------
quarkus.smallrye-openapi.info-title=Auth Service API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.swagger-ui.always-include=true

# ---------------------------------------------------------------------------
# Metrics (Micrometer + Prometheus) at /q/metrics
# ---------------------------------------------------------------------------
quarkus.micrometer.export.prometheus.enabled=true

# ---------------------------------------------------------------------------
# Kubernetes manifests, generated at build time into target/kubernetes/kubernetes.yml
# (health probes added automatically). The Secret holds DB_URL, DB_USERNAME, DB_PASSWORD;
# the private signing key is mounted from a second Secret:
#   kubectl create secret generic auth-service-db --from-literal=DB_URL=... --from-literal=DB_USERNAME=... --from-literal=DB_PASSWORD=...
#   kubectl create secret generic jwt-signing-key --from-file=privateKey.pem=keys/privateKey.pem
# ---------------------------------------------------------------------------
quarkus.kubernetes.part-of=expense-tracker
quarkus.kubernetes.env.secrets=auth-service-db
quarkus.kubernetes.env.vars.jwt-private-key-location=/etc/jwt/privateKey.pem
quarkus.kubernetes.secret-volumes.jwt-key.secret-name=jwt-signing-key
quarkus.kubernetes.mounts.jwt-key.path=/etc/jwt
quarkus.kubernetes.mounts.jwt-key.read-only=true
quarkus.kubernetes.resources.requests.memory=256Mi
quarkus.kubernetes.resources.limits.memory=512Mi
quarkus.container-image.group=expense-tracker
quarkus.kubernetes.image-pull-policy=if-not-present
