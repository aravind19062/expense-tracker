# Starts the whole backend:   docker compose up --build
# Prerequisites: ./scripts/generate-keys.sh  and  cp .env.example .env (then edit)
name: expense-tracker

x-service-healthcheck: &service-healthcheck
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 10s

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in .env}
      EXPENSE_DB_PASSWORD: ${EXPENSE_DB_PASSWORD:?set EXPENSE_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    ports:
      - "127.0.0.1:5432:5432"      # for running services in dev mode on the host
    healthcheck:
      # TCP check: the temporary server used during init scripts only listens on a socket,
      # so this turns healthy only after both databases exist.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d expense_db && pg_isready -h 127.0.0.1 -U postgres -d auth_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  auth-service:
    build: ./auth-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/auth_db
      DB_USERNAME: auth_user
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      JWT_PRIVATE_KEY_LOCATION: /run/secrets/jwt_private_key
      JWT_ISSUER: ${JWT_ISSUER:-https://expense-tracker.local/auth}
      JWT_LIFESPAN_SECONDS: ${JWT_LIFESPAN_SECONDS:-3600}
    secrets:
      - jwt_private_key
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"      # direct access for debugging only; clients use the gateway
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/q/health/ready || exit 1"]
      <<: *service-healthcheck

  expense-service:
    build: ./expense-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/expense_db
      DB_USERNAME: expense_user
      DB_PASSWORD: ${EXPENSE_DB_PASSWORD}
      HTTP_PORT: "8082"
      JWT_PUBLIC_KEY_LOCATION: http://auth-service:8081/api/auth/jwks
      JWT_ISSUER: ${JWT_ISSUER:-https://expense-tracker.local/auth}
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8082"      # direct access for debugging only; clients use the gateway
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8082/q/health/ready || exit 1"]
      <<: *service-healthcheck

  api-gateway:
    build: ./api-gateway
    environment:
      # SmallRye Stork static service lists (comma-separate several instances)
      AUTH_SERVICE_ADDRESSES: auth-service:8081
      EXPENSE_SERVICE_ADDRESSES: expense-service:8082
      JWT_PUBLIC_KEY_LOCATION: http://auth-service:8081/api/auth/jwks
      JWT_ISSUER: ${JWT_ISSUER:-https://expense-tracker.local/auth}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
    depends_on:
      auth-service:
        condition: service_healthy
      expense-service:
        condition: service_healthy
    ports:
      - "8080:8080"                # the single public entry point
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/q/health/ready || exit 1"]
      <<: *service-healthcheck

secrets:
  jwt_private_key:
    file: ./keys/privateKey.pem

volumes:
  pgdata:
