# ---------------------------------------------------------------------------
# Expense Service
# ---------------------------------------------------------------------------
quarkus.application.name=expense-service
quarkus.http.port=${HTTP_PORT:8080}
quarkus.http.test-port=0

# ---------------------------------------------------------------------------
# Database (PostgreSQL). Credentials always come from the environment.
# ---------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql

# dev: a locally running PostgreSQL (e.g. `docker compose up postgres`).
%dev.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/expense_db}
%dev.quarkus.datasource.username=${DB_USERNAME:expense_user}
%dev.quarkus.datasource.password=${DB_PASSWORD}
%dev.quarkus.hibernate-orm.schema-management.strategy=update
%dev.quarkus.hibernate-orm.log.sql=true

# test: Quarkus Dev Services starts a throwaway PostgreSQL container (requires Docker).
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# prod: everything injected by the runtime environment (docker-compose / k8s secrets).
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
# Same strategy as the original Spring app (ddl-auto=update).
%prod.quarkus.hibernate-orm.schema-management.strategy=update

# ---------------------------------------------------------------------------
# JWT verification (SmallRye JWT). Tokens are RS256-signed by auth-service;
# the public key is fetched from auth-service's JWKS endpoint.
# ---------------------------------------------------------------------------
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:http://localhost:8081/auth/jwks}
mp.jwt.verify.issuer=${JWT_ISSUER:https://expense-tracker.local/auth}
mp.jwt.verify.publickey.algorithm=RS256
# Refresh the cached JWKS at most every 10 minutes (supports key rotation).
smallrye.jwt.jwks.refresh-interval=10

# ---------------------------------------------------------------------------
# OpenAPI / Swagger UI
# ---------------------------------------------------------------------------
quarkus.smallrye-openapi.info-title=Expense Service API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.swagger-ui.always-include=true
